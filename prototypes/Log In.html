<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log In — Legalite.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F0E8;
    --ink: #3D2E1E;
    --ink-2: #5a4730;
    --ink-3: #806a4f;
    --gold: #C9A96E;
    --gold-deep: #b59154;
    --tan: #D4C5A9;
    --tan-soft: #e3d6bb;
    --card: #EDE6D6;
    --card-2: #ece3cf;
    --cream: #FBF7F0;
    --line: rgba(61, 46, 30, 0.12);
    --line-2: rgba(61, 46, 30, 0.18);
    --ok: #4f7a3a;
    --shadow-sm: 0 1px 2px rgba(61,46,30,0.06), 0 1px 1px rgba(61,46,30,0.04);
    --shadow-md: 0 8px 24px -10px rgba(61,46,30,0.18), 0 2px 6px rgba(61,46,30,0.06);
    --shadow-lg: 0 24px 48px -18px rgba(61,46,30,0.28), 0 6px 14px rgba(61,46,30,0.08);
    --shadow-xl: 0 36px 80px -24px rgba(61,46,30,0.35), 0 10px 24px rgba(61,46,30,0.1);
    --serif: 'Cormorant Garamond', 'Times New Roman', serif;
    --sans: 'DM Sans', -apple-system, system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--gold); color: var(--ink); }
  a { color: inherit; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; }

  /* ---------- NAV ---------- */
  .nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(245, 240, 232, 0.82);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid transparent;
    transition: border-color 220ms ease, box-shadow 220ms ease;
  }
  .nav.scrolled {
    border-bottom-color: var(--line);
    box-shadow: 0 1px 0 rgba(61,46,30,0.02);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 76px;
  }
  .brand {
    font-family: var(--serif);
    font-size: 28px;
    letter-spacing: -0.01em;
    font-weight: 600;
    color: var(--ink);
    display: flex; align-items: center;
    text-decoration: none;
  }
  .brand-dot {
    color: var(--gold);
    font-style: italic;
    font-weight: 500;
  }

  /* ---------- LOGIN CONTAINER ---------- */
  .login-wrapper {
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - 76px);
    padding: 40px;
  }

  .login-card {
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 56px;
    box-shadow: var(--shadow-lg);
    max-width: 420px;
    width: 100%;
  }

  .login-eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold-deep);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .login-eyebrow::before {
    content: "";
    width: 24px; height: 1px;
    background: var(--gold);
  }

  .login-title {
    font-family: var(--serif);
    font-size: 40px;
    font-weight: 500;
    color: var(--ink);
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }

  .login-subtitle {
    font-size: 14px;
    color: var(--ink-2);
    margin-bottom: 32px;
  }

  .form-group {
    margin-bottom: 24px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .form-input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    font-family: var(--sans);
    font-size: 15px;
    color: var(--ink);
    transition: border-color 200ms ease, box-shadow 200ms ease, background 200ms ease;
  }

  .form-input::placeholder {
    color: var(--ink-3);
  }

  .form-input:focus {
    outline: none;
    border-color: var(--gold);
    background: white;
    box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.1);
  }

  .form-options {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
    font-size: 13px;
  }

  .checkbox-wrap {
    display: flex; align-items: center; gap: 8px;
  }

  .checkbox-input {
    width: 16px; height: 16px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--bg);
    cursor: pointer;
    transition: all 200ms ease;
  }

  .checkbox-input:checked {
    background: var(--gold);
    border-color: var(--gold);
  }

  .forgot-link {
    color: var(--gold-deep);
    text-decoration: none;
    font-weight: 500;
    transition: color 200ms ease;
  }

  .forgot-link:hover {
    color: var(--ink);
  }

  .form-button {
    width: 100%;
    padding: 16px;
    background: var(--ink);
    color: var(--cream);
    border: none;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 200ms cubic-bezier(.2,.7,.2,1), box-shadow 220ms ease, background 200ms ease;
    box-shadow: var(--shadow-sm);
  }

  .form-button:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    background: #2d2114;
  }

  .form-button:active {
    transform: translateY(0);
  }

  .form-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 28px 0;
    color: var(--ink-3);
    font-size: 13px;
  }

  .form-divider::before,
  .form-divider::after {
    content: "";
    flex: 1; height: 1px;
    background: var(--line);
  }

  .social-button {
    width: 100%;
    padding: 14px;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease;
    margin-bottom: 12px;
  }

  .social-button:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
    background: var(--card-2);
  }

  .social-button:last-of-type {
    margin-bottom: 0;
  }

  .signup-link {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
    color: var(--ink-2);
  }

  .signup-link a {
    color: var(--gold-deep);
    font-weight: 600;
    text-decoration: none;
    transition: color 200ms ease;
  }

  .signup-link a:hover {
    color: var(--ink);
  }

  /* ---------- ANIMATIONS ---------- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .fade-up {
    opacity: 0;
    animation: fadeUp 700ms cubic-bezier(.2,.7,.2,1) forwards;
  }

  .d-1 { animation-delay: 60ms; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 640px) {
    .login-card {
      padding: 36px;
    }
    .login-title {
      font-size: 32px;
    }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav" id="nav">
  <div class="wrap nav-inner">
    <a href="Legalite Homepage.html" class="brand">Legalite<span class="brand-dot">.ai</span></a>
  </div>
</nav>

<!-- LOGIN -->
<div class="login-wrapper">
  <div class="login-card fade-up d-1">
    <div class="login-eyebrow">Welcome back</div>
    <h1 class="login-title">Log In</h1>
    <p class="login-subtitle">Access your AIBE prep.</p>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" placeholder="••••••••" required />
      </div>

      <div class="form-options">
        <label class="checkbox-wrap">
          <input type="checkbox" class="checkbox-input" />
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="form-button">Log In</button>

      <div class="form-divider">or</div>

      <button type="button" class="social-button">Continue with Google</button>
      <button type="button" class="social-button">Continue with Apple</button>

      <div class="signup-link">
        Don't have an account? <a href="Sign Up.html">Sign up here</a>
      </div>
    </form>
  </div>
</div>

<script>
  // Sticky nav shadow on scroll
  const nav = document.getElementById('nav');
  const onScroll = () => {
    if (window.scrollY > 8) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // Form handling
  const form = document.getElementById('loginForm');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    alert('Welcome back to Legalite!');
    form.reset();
  });
</script>

</body>
</html>
